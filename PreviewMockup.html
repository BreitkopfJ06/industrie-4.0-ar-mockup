<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 - AR HUD View</title>
 
  <!-- A-Frame und AR.js einbinden -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
 
  <!-- AR Event Listener Komponente -->
  <script>
    AFRAME.registerComponent('markerhandler', {
      init: function () {
        const hud = document.getElementById('hud');
 
        this.el.addEventListener('markerFound', () => {
          console.log('Marker gefunden! Blende HUD ein.');
          hud.classList.remove('hidden');
        });
 
        this.el.addEventListener('markerLost', () => {
          console.log('Marker verloren! Blende HUD aus.');
          hud.classList.add('hidden');
        });
      }
    });
 
    window.simulateMarkerFound = () => {
      document.getElementById('hiro-marker').emit('markerFound');
    }
 
    window.simulateMarkerLost = () => {
      document.getElementById('hiro-marker').emit('markerLost');
    }
  </script>
 
  <!-- WebSocket Verbindung zu Node-RED auf dem Raspberry Pi -->
  <script>
    // ⚠️ HIER ANPASSEN: Ersetze die IP-Adresse mit der lokalen IP oder Domain deines Raspberry Pi
    const PI_IP = "192.168.178.50";
    const ws = new WebSocket(`ws://${PI_IP}:1880/ws/ar-data`);
 
    ws.onopen = () => {
      console.log("WebSocket-Verbindung zu Node-RED erfolgreich aufgebaut!");
    };
 
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        console.log("Neue Daten empfangen:", data);
 
        // Vibrationswert aktualisieren und Schwellwert prüfen (z.B. ab 4.5 rot)
        if (data.vibration !== undefined) {
          const vibElement = document.getElementById('val-vibration');
          vibElement.innerText = `${data.vibration} mm/s`;
 
          if (data.vibration > 4.5) {
            vibElement.className = "data-val";
            vibElement.style.color = "#ef4444"; // Alarm-Rot
          } else {
            vibElement.className = "data-val status-ok";
            vibElement.style.color = ""; // Grün / Normal
          }
        }
 
        // Andere Werte optional aktualisieren, falls mitgesendet
        if (data.tara !== undefined) document.getElementById('val-tara').innerText = data.tara;
        if (data.netto !== undefined) document.getElementById('val-netto').innerText = data.netto;
        if (data.mengeRot !== undefined) document.getElementById('val-menge-rot').innerText = data.mengeRot;
        if (data.mengeBlau !== undefined) document.getElementById('val-menge-blau').innerText = data.mengeBlau;
        if (data.gewichtKugeln !== undefined) document.getElementById('val-gewicht-kugeln').innerText = data.gewichtKugeln;
 
      } catch (e) {
        console.error("Fehler beim Verarbeiten der WebSocket-Daten:", e);
      }
    };
 
    ws.onerror = (error) => {
      console.error("WebSocket Fehler:", error);
    };
 
    ws.onclose = () => {
      console.warn("WebSocket-Verbindung getrennt.");
    };
  </script>
 
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      width: 100vw;
      height: 100vh;
    }
 
    video, canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
      z-index: 1;
    }
 
    .hidden {
      display: none !important;
    }
 
    .hud-container {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: auto 1fr auto;
      padding: 20px;
      pointer-events: none;
      box-sizing: border-box;
      animation: fadeIn 0.3s ease-out;
    }
 
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
 
    .ar-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f8fafc;
