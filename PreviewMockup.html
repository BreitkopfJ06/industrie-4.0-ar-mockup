<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 AR Dashboard</title>
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <script>
    AFRAME.registerComponent('markerhandler', {
      init: function () {
        const overlay = document.getElementById('overlay');
        
        this.el.addEventListener('markerFound', () => {
          console.log('Marker gefunden! Blende Dashboard ein.');
          overlay.style.display = 'block';
        });

        this.el.addEventListener('markerLost', () => {
          console.log('Marker verloren! Blende Dashboard aus.');
          overlay.style.display = 'none';
        });
      }
    });

    window.simulateMarkerFound = () => {
      document.getElementById('hiro-marker').emit('markerFound');
    }
    
    window.simulateMarkerLost = () => {
      document.getElementById('hiro-marker').emit('markerLost');
    }
  </script>

  <style>
    :root { 
      color-scheme: dark; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    #overlay {
      display: none; 
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999; 
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f8fafc;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.3s ease-out;
    }

    #debug-controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      gap: 12px;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 12px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    .btn-found { background-color: #3b82f6; }
    .btn-lost { background-color: #ef4444; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -45%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
