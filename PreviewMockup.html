<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 AR Dashboard</title>
  
  <!-- A-Frame und AR.js (Kamerabild) wieder eingebunden -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  
  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root { 
      color-scheme: dark; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
    body {
      margin: 0;
      overflow: hidden; /* Wichtig für das Kamerabild */
      background-color: #000;
    }

    /* Das Dashboard (jetzt standardmäßig auf display: block gesetzt) */
    #overlay {
      display: block; /* <- Hier geändert: Das Menü ist immer sichtbar */
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999; 
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85); /* Leicht transparent für den AR-Effekt */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f8fafc;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -45%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    h2 { 
      margin-top: 0; 
      font-size: 1.4rem; 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
      padding-bottom: 12px; 
      color: #38bdf8; 
      text-align: center;
      letter-spacing: 0.5px;
    }

    .section { margin-bottom: 22px; }
    .section:last-child { margin-bottom: 0; }
    
    .section-title { 
      font-weight: bold; 
      font-size: 0.85rem; 
      margin-bottom: 12px; 
      color: #94a3b8; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }
    
    .data-row { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 10px; 
      font-size: 0.95rem; 
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
      padding-bottom: 4px;
    }
    .data-row:last-child { border-bottom: none; }
    
    .data-label { color: #cbd5e1; }
    .data-value { font-weight: 600; color: #fff; text-align: right; }
    
    .status-ok { color: #4ade80; }
    .status-active { color: #60a5fa; }
    
    /* Dynamische Farbgebung für kritische Vibrationswerte */
    .val-critical { color: #ef4444 !important; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Das Kamerabild auf volle Größe skalieren */
    video, canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }
  </style>
</head>
<body>

  <!-- Das Dashboard / Overlay -->
  <div id="overlay">
    <h2>Maschinen-Monitor</h2>

    <div class="section">
      <div class="section-title">Power House Sensorik</div>
      <div class="data-row">
        <span class="data-label">Vibration (LF7/21):</span> 
        <span class="data-value" id="val-vibration">Warte auf Daten...</span>
      </div>
      <div class="data-row">
        <span class="data-label">Status:</span> 
        <span class="data-value status-active" id="val-status">Verbinde...</span>
      </div>
    </div>

    <!-- Neuer Zeitstempel (optional) -->
    <div class="section">
      <div class="section-title">System</div>
      <div class="data-row"><span class="data-label">Letztes Update:</span> <span class="data-value" id="val-time">-</span></div>
    </div>
  </div>

  <!-- AR.js Szene OHNE a-marker Tag -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    embedded
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">
    
    <!-- Nur noch die Kamera-Entität (startet den Live-Feed) -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const mqttBrokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    const clientId = 'ar_dashboard_' + Math.random().toString(16).substr(2, 8);

    console.log(`Verbinde mit MQTT Broker unter ${mqttBrokerUrl}...`);
    
    const client = mqtt.connect(mqttBrokerUrl, {
      clientId: clientId,
      clean: true,
      connectTimeout: 4000,
      reconnectPeriod: 1000,
    });

    client.on('connect', () => {
      console.log('Erfolgreich mit MQTT Broker verbunden!');
      document.getElementById('val-status').innerText = 'Online / Warte';
      document.getElementById('val-status').className = 'data-value status-active';
      
      // Das Topic abonnieren
      client.subscribe('/bbk-lf7/21/power-house/vibration');
    });

    client.on('message', (topic, message) => {
      const payload = message.toString();
      console.log(`Nachricht empfangen auf ${topic}: ${payload}`);

      if (topic === '/bbk-lf7/21/power-house/vibration') {
        const vibElement = document.getElementById('val-vibration');
        const statusElement = document.getElementById('val-status');
        
        // Wert direkt aktualisieren
        vibElement.innerText = payload;

        // Zeitstempel aktualisieren (hilft zu sehen, dass die Verbindung "lebt")
        const now = new Date();
        document.getElementById('val-time').innerText = now.toLocaleTimeString('de-DE');

        // Optional: Wenn der Vibrationswert über 10 ist, wird es rot
        const numericValue = parseFloat(payload);
        if (!isNaN(numericValue) && numericValue > 10.0) {
          vibElement.classList.add('val-critical');
          statusElement.innerText = "Warnung";
          statusElement.className = "data-value val-critical";
        } else {
          vibElement.classList.remove('val-critical');
          statusElement.innerText = "Normal";
          statusElement.className = "data-value status-ok";
        }
      }
    });

    client.on('error', (err) => {
      console.error('MQTT Verbindungsfehler: ', err);
      document.getElementById('val-status').innerText = 'Fehler!';
      document.getElementById('val-status').className = 'data-value val-critical';
    });
  </script>
</body>
</html>
